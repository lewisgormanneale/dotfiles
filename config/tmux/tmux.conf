# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g default-terminal "screen-256color"
set -as terminal-overrides ",xterm-256color:Tc"
set -g status-interval 2
set -g mouse off
set -g history-limit 10000

# Keybinds
bind | split-window -h
bind - split-window -v
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux reloaded"
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind x confirm-before -p "kill-pane? (y/n)" kill-pane
bind X confirm-before -p "kill-window? (y/n)" kill-window

# Catppuccin Mocha colors
set -g status-position top
set -g status-justify centre
set -g status-bg "#1e1e2e"
set -g status-fg "#cdd6f4"
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g window-status-format " #I:#W "
set -g window-status-current-format " #[bold]#I:#W* "
set -g window-status-current-style "bg=#45475a,fg=#f5c2e7"
set -g window-status-style "bg=#1e1e2e,fg=#a6adc8"

set -g message-command-style "fg=#f5c2e7,bg=#1e1e2e"
set -g message-style "fg=#f5c2e7,bg=#1e1e2e"
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

# Statusline content
set -g status-left "#[fg=#89dceb,bg=#1e1e2e,bold] #S #[default]"
set -g status-right "#[fg=#a6e3a1]#(whoami) #[fg=#f9e2af]%Y-%m-%d %H:%M "

# Vi copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
