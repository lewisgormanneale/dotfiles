# Catppuccin Mocha theme
include current-theme.conf

# Font configuration
font_family      JetBrains Mono Nerd Font
bold_font        JetBrains Mono Nerd Font Bold
italic_font      JetBrains Mono Nerd Font Italic
bold_italic_font JetBrains Mono Nerd Font Bold Italic
font_size 13.0
adjust_line_height 120%

# Cursor
cursor_shape beam
cursor_blink_interval 0

# Window appearance
window_padding_width 8 10
hide_window_decorations titlebar-only
background_opacity 0.9
background_blur 20

# Tab bar
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Shell
shell /opt/homebrew/bin/zsh

# Disable audio bell
enable_audio_bell no

# macOS specific
macos_option_as_alt yes
macos_quit_when_last_window_closed yes
macos_show_window_title_in none

# Keyboard shortcuts - keep native tab behavior
# Cmd+T for new tab works by default
# Cmd+W to close tab works by default
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
